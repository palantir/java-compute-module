pluginManagement {
    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }
}

buildscript {
    dependencies { classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.79.0' }
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}
apply plugin: 'com.palantir.jdks.settings'

rootProject.name = 'java-compute-module'

include 'lib'
include 'lib-api'
include 'lib-api:lib-api-objects'
